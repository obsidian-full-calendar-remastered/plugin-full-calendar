name: Deploy Docs

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    paths:
      - 'docs/**'
      - 'tools/generate-plugin-docs-index.mjs'
      - 'tools/build_docs.py'
      - 'tools/generate_seo_assets.py'
      - 'tools/docs/**'
      - 'manifest-beta.json'
      - 'requirements.txt'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      rebuild_stable:
        description: 'Force rebuild of Stable docs in addition to Beta'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache git-committers
        uses: actions/cache@v3
        with:
          path: .cache/plugin/git-committers
          key: ${{ runner.os }}-git-committers-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-git-committers-

      - name: Fetch existing gh-pages snapshot (if present)
        run: git fetch origin gh-pages:refs/remotes/origin/gh-pages --depth=1 || true

      - name: Build Stable + Beta MkDocs site
        env:
          MKDOCS_GIT_COMMITTERS_APIKEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/build_docs.py \
            --mode auto \
            --output-dir site \
            --gh-pages-ref origin/gh-pages \
            --event-name "${{ github.event_name }}" \
            --git-ref "${{ github.ref }}" \
            --force-stable "${{ inputs.rebuild_stable || 'false' }}"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true # Creates a clean history for the gh-pages branch
