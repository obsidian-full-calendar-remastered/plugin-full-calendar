name: Check
on:
    - push
jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }}
            - uses: actions/setup-node@v4
              with:
                  node-version: "22.x"
            - uses: pnpm/action-setup@v4
            - run: pnpm install --no-frozen-lockfile
            - run: pnpm run lint
            - run: pnpm run compile
    tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }}
            - uses: actions/setup-node@v4
              with:
                  node-version: "22.x"
            - uses: pnpm/action-setup@v4
            - run: pnpm install --no-frozen-lockfile
            - run: pnpm run test-update
