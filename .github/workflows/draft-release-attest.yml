name: Draft Release With Attestation

on:
    workflow_dispatch:

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    draft-release:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Verify version match (manifest.json vs manifest-beta.json)
              run: |
                  MANIFEST_VER=$(jq -r '.version' manifest.json)
                  BETA_VER=$(jq -r '.version' manifest-beta.json)
                  echo "manifest.json version: $MANIFEST_VER"
                  echo "manifest-beta.json version: $BETA_VER"
                  if [ "$MANIFEST_VER" != "$BETA_VER" ]; then
                    echo "::error::Version mismatch! manifest.json is $MANIFEST_VER but manifest-beta.json is $BETA_VER"
                    exit 1
                  fi

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "22.x"

            - uses: pnpm/action-setup@v6
              with:
                  run_install: false

            - name: Install dependencies
              run: pnpm install

            - name: Build release artifacts
              run: pnpm run prod:release

            - name: Attest artifacts
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      release-artifacts/main.js
                      release-artifacts/styles.css
                      release-artifacts/manifest.json

            - name: Compute draft release metadata
              id: metadata
              run: |
                  echo "tag_name=draft-main-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
                  echo "release_name=Draft Main Build #${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

            - name: Create draft release and upload assets
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.metadata.outputs.tag_name }}
                  target_commitish: ${{ github.sha }}
                  name: ${{ steps.metadata.outputs.release_name }}
                  draft: true
                  prerelease: true
                  files: |
                      release-artifacts/main.js
                      release-artifacts/styles.css
                      release-artifacts/manifest.json
