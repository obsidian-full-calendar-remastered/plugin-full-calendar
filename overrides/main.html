{% extends "base.html" %}

{% block extrahead %}
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{% if page.title %}{{ page.title }} - {% endif %}{{ config.site_name }}" />
  <meta property="og:description" content="{% if page.meta and page.meta.description %}{{ page.meta.description }}{% elif config.site_description %}{{ config.site_description }}{% else %}Professional calendar orchestration for Obsidian with local note-based and remote (Google Calendar, Outlook, CalDAV, ICS) providers.{% endif %}" />
  <meta property="og:url" content="{{ page.canonical_url }}" />
  <meta property="og:image" content="{{ config.site_url }}assets/branding/icon-light.png" />
  <meta property="og:site_name" content="{{ config.site_name }}" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }} - {% endif %}{{ config.site_name }}" />
  <meta name="twitter:description" content="{% if page.meta and page.meta.description %}{{ page.meta.description }}{% elif config.site_description %}{{ config.site_description }}{% else %}Professional calendar orchestration for Obsidian with local note-based and remote (Google Calendar, Outlook, CalDAV, ICS) providers.{% endif %}" />
  <meta name="twitter:image" content="{{ config.site_url }}assets/branding/icon-light.png" />

  <!-- Internationalization (hreflang) -->
  <link rel="alternate" hreflang="x-default" href="{{ page.canonical_url }}" />
  <link rel="alternate" hreflang="en" href="{{ page.canonical_url }}" />

  <!-- Markdown Alternate for AI Crawlers -->
  <link rel="alternate" type="text/markdown" href="{{ page.canonical_url }}index.md" />

  <!-- AI Snippet Control -->
  <meta name="robots" content="max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "{{ config.site_name }}",
    "applicationCategory": "ProductivityApplication",
    "operatingSystem": "Windows, macOS, Linux, iOS, Android",
    "url": "{{ config.site_url }}",
    "description": "Professional calendar orchestration for Obsidian with local note-based and remote (Google Calendar, Outlook, CalDAV, ICS) providers.",
    "applicationSubCategory": "Calendar and Task Management",
    "softwareVersion": "0.13.4",
    "offers": {
      "@type": "Offer",
      "price": "0.00",
      "priceCurrency": "USD"
    },
    "author": {
      "@type": "Organization",
      "name": "Obsidian Full Calendar Remastered Team",
      "url": "https://github.com/obsidian-full-calendar-remastered"
    }
  }
  </script>
{% endblock %}
